[project]
name = "eval-ocr-htr"
version = "0.1.0"
description = "Benchmark OCR/HTR models on scanned handwritten documents (Albert API)."
readme = "README.md"
authors = [
    { name = "DINUM, IA dans l'État" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pymupdf>=1.24.0",
]

[project.scripts]
eval-ocr-htr = "eval_ocr_htr:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
